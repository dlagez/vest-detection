model:
  path: "weights/yolo11m_safety.pt"
  confidence: 0.35
  iou: 0.5
  imgsz: 640

classes:
  # All classes supported by weights/yolo11m_safety.pt
  names:
    0: hat
    1: nohat
    2: novest
    3: person
    4: vest
  # Classes to detect (by name or index). Empty = all.
  filter: [4]
  # Friendly display names (key: class_name -> display_label)
  display_names:
    hat: "安全帽"
    nohat: "未戴安全帽"
    novest: "未穿反光衣"
    person: "人员"
    vest: "穿戴反光衣"

output:
  save_json: true
  save_annotated: true

video:
  enable_tracking: true